<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor Kim — Portfolio</title>
  <style>
    :root { --bg: #f5f4f0; --fg: #111; --muted: #6b6b6b; --line: #d9d7d0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0e; --fg: #f2f2f2; --muted: #8a8a8a; --line: #2a2a2a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 24px 16px; }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 15px; font-weight: 500; margin: 0 0 32px; letter-spacing: -0.01em; }
    a { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      padding: 20px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
    a:last-of-type { border-bottom: 1px solid var(--line); }
    a span:first-child { font-size: 28px; letter-spacing: -0.02em; }
    a span:last-child { font-size: 13px; color: var(--muted); }
    a:hover span:first-child { text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Harbor Kim — Product Designer</h1>
    <a href="./portfolio-1/" target="_blank" rel="noopener"><span>Portfolio 01</span><span>open →</span></a>
    <a href="./portfolio-2/" target="_blank" rel="noopener"><span>Portfolio 02</span><span>open →</span></a>
  </main>
</body>
</html>
